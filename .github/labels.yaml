# Every label this board uses, and the authority for which labels exist on it.
# The sync deletes any label not named here, so a label added by hand and not
# added to this file is removed on the next run. Seeded from the board's own
# label set, not from the upstream file, so nothing this plan depends on can
# be dropped by an upstream edit.

