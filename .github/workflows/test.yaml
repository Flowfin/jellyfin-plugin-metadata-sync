name: '🧪 Test Plugin'

# No path filter on either trigger. This job produces the required context
# `call / test`, and a required context that never starts is pending rather
# than failed, so a change touching only markdown waits on a check that will
# never report and its merge state stays uncomputable. Adding a filter here
# again makes every documentation-only change unmergeable, silently. The cost
# of not filtering is one test run per documentation change.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny at the workflow level so the job below has to name what it takes.
permissions: {}

jobs:
  call:
    # The called workflow checks out, sets up dotnet, restores, builds and runs
    # the suite. Reading the tree is the only token scope any of those steps
    # uses.
    permissions:
      contents: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/test.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # jellyfin-meta-plugins master, 2026-07-29
    with:
      # Both SDKs and both runtimes. The suite targets one framework per
      # supported server line, so this job builds and runs it twice, and a
      # guard that holds on one line and not the other is red here rather than
      # unread.
      dotnet-version: |
        9.0.x
        10.0.x
