name: '🏗️ Build Plugin'

# No path filter on either trigger. This job produces the required context
# `call / build`, and a required context that never starts is pending rather
# than failed, so a change touching only markdown waits on a check that will
# never report and its merge state stays uncomputable. Adding a filter here
# again makes every documentation-only change unmergeable, silently. The cost
# of not filtering is one build per documentation change.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

# Deny at the workflow level so the job below has to name what it takes.
permissions: {}

jobs:
  call:
    # The called workflow checks out, sets up dotnet, runs jprm and uploads a
    # build artefact. Reading the tree is the only token scope any of those
    # steps uses.
    permissions:
      contents: read
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # jellyfin-meta-plugins master, 2026-07-29
