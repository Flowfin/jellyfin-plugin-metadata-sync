# Deterministic checks about the pull request rather than about the code (#78).
#
# Every other gate here reasons about what the tree contains. This one reasons
# about the change: whether it names the issue that produced it, whether the
# release note will carry it in the class an operator reads, and whether it is
# small enough to review. That class of failure is invisible to a compiler and
# to every analyser in this repository.
#
# It is implemented here rather than by a service, so a red run is explainable
# from this file. Every rule below is one a person can predict before pushing.
#
# ## The two tiers
#
# The refusing tier fails the job. Each of its checks is one where a false
# positive is close to impossible and the repair is one edit by the person who
# opened the change.
#
# The advisory tier annotates and never fails. Its checks are conventions with
# real exceptions, and a gate that reds a legitimate change teaches people to
# ignore it.
#
# Whether a red run here holds a merge is decided by the branch ruleset and not
# by this file. Do not copy the required set into this header, where it would
# drift unnoticed. Print it:
#
#   gh api repos/Flowfin/jellyfin-plugin-metadata-sync/rulesets \
#     --jq '.[] | select(.name == "gate") | .id'
#   gh api repos/Flowfin/jellyfin-plugin-metadata-sync/rulesets/<id> \
#     --jq '[.rules[] | select(.type == "required_status_checks")
#            | .parameters.required_status_checks[].context]'
#
# ## How a change says what it finishes
#
# The tracker reads `<keyword> #<number>` in a body as an instruction, and it
# does not read the sentence around it. Three times on this board a body has
# said in plain words that a change leaves an issue open, and the merge closed
# it anyway; each cost a reopen and a comment saying the closure was not a
# judgement. A rule broken by writing a true sentence in the obvious order is a
# spelling trap rather than a rule anybody keeps, so check 7 refuses the pattern
# outright and the relation is declared instead, on a line of its own:
#
#   Finishes: #123
#
# at column zero, so a body can show the shape inside an indented block without
# declaring anything. That line is the only place this workflow reads the
# relation from. A body
# therefore says once what it finishes and may write any sentence it likes
# everywhere else, including a sentence about an issue it is not finishing.
#
# Nothing closes the issue on merge afterwards. Closing it stays a judgement
# somebody makes, with the merge commit beside it, which is what all three of
# the reopens above were spent restoring by hand.
#
# ## What this gate does not check
#
# The changelog has three classes that mark a change an operator has to read
# before upgrading, and check 4 keys two of them to the files they are about.
# The third is the consumer contract, and there is no contract type in this tree
# to key it to. A path written here for a file that does not exist would be a
# rule pointed at nothing, passing for the wrong reason until somebody creates
# the path and never noticing if they create a different one. That rule lands
# with the contract, and until it does the class on a contract change is a
# convention `docs/changelog.md` describes.
#
# Nothing here judges whether a class was chosen correctly, whether an issue
# reference points at the right issue, or whether a change that touched the
# suite touched it usefully. Those are what the review is for.
#
# ## What a new or edited workflow owes
#
# The header of `.github/workflows/zizmor.yml` holds it. This job checks nothing
# out: every input is the pull request's own metadata read through the API, so
# there is no working tree to guard and no credential to persist. Untrusted
# values, the body, the labels and the file names, are read from the API objects
# and never interpolated into a shell step.
name: PR Hygiene

on:
  pull_request:
    # edited, labeled and unlabeled are here because two of the refusing checks
    # read the body and the labels. Without them, supplying the thing the gate
    # asked for leaves the run red until an unrelated push.
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

# Explicit deny-all at workflow level; the job below grants only what it reads.
permissions: {}

# Cancel a superseded run on the same pull request. This is a lint and not a
# publish, so dropping an obsolete run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Deterministic pull request hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # read the changed files and their patches through the API
      pull-requests: read # read the body, the labels and the commit list
      issues: read # confirm the issue a body names is an issue that exists
    steps:
      - name: Run the hygiene checks
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const refusals = [];
            const advisories = [];

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const changed = files.map((f) => f.filename);
            const labels = (pr.labels || []).map((l) => l.name);

            // Who the refusing tier is for. A bot opens a change with no issue
            // because it cannot know there is one, so it is the one author the
            // tier is not for.
            //
            // It is not narrowed any further, and that is a correction rather
            // than a simplification. It was first written to skip an author
            // whose `author_association` was not OWNER or MEMBER, on the
            // reasoning that somebody arriving from outside cannot know the
            // issue numbers this board expects.
            //
            // What was then observed, on a pull request opened from this board:
            // the body was edited to name no issue at all, the gate ran on that
            // edit, and it passed. The refusing tier had turned itself off. The
            // association it turned on is the only branch that produces that
            // result, and it was inferred from the run rather than read out of
            // the payload, because nothing printed it. Both halves of that are
            // the defect. A guard that decides whether to run on a value nobody
            // can see is the shape that passes for the wrong reason forever, and
            // it is worse than no guard, which at least does not report success.
            //
            // So the tier applies to everybody but a bot. What it costs is a red
            // check on a first change from somebody who could not have known the
            // convention. The check says what is missing in one sentence, the
            // repair is one edit to the body, and whoever handles that change
            // can supply the issue. That is a cheaper failure than a gate that
            // reports green without having looked.
            const isBot = pr.user && pr.user.type === "Bot";
            const refusingTierApplies = !isBot;

            // The changelog classes, in the order `docs/changelog.md` argues
            // them. They are written here rather than read from the document
            // because this job checks nothing out. `PullRequestHygieneTests`
            // holds this list against that document in both directions, so a
            // class added to one and not the other reddens the suite.
            const CLASS_LABELS = [
              "changelog: contract",
              "changelog: field-register",
              "changelog: conflict-rule",
              "security",
              "enhancement",
              "bug",
              "documentation",
            ];

            // The two classes whose subject is a file in this tree. A change to
            // one of these files is a change an operator has to read before
            // upgrading, and it can arrive spelled as a fix.
            const CLASS_BY_SUBJECT = [
              {
                label: "changelog: field-register",
                subject: "which fields move between two servers",
                paths: [
                  "Jellyfin.Plugin.MetadataSync/Fields/field-register.json",
                  "docs/field-register.md",
                ],
              },
              {
                label: "changelog: conflict-rule",
                subject: "how a disagreement between two servers is decided",
                paths: [
                  "Jellyfin.Plugin.MetadataSync/Conflicts/conflict-rules.json",
                  "docs/conflicts.md",
                ],
              },
            ];

            // Check 1. Refuses a change with no route back to the reasoning that
            // produced it. A number that names nothing is refused too, because a
            // typo in a reference reads exactly like a link.
            const body = pr.body || "";
            const referenced = [
              ...new Set([...body.matchAll(/(?:^|[^\w])#(\d+)\b/g)].map((m) => Number(m[1]))),
            ];
            let named = [];
            for (const number of referenced) {
              try {
                await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: number,
                });
                named.push(number);
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }
            if (refusingTierApplies && named.length === 0) {
              refusals.push(
                referenced.length === 0
                  ? "The body names no issue. Name the issue this change is from, as `Refs #123`, and where it finishes one, declare that as `Finishes: #123` on a line of its own."
                  : `The body names #${referenced.join(", #")}, and no number among them is an issue on this board.`,
              );
            }

            // Check 2. Refuses a commit subject that says what changed without
            // saying why. Blame, log and bisect show a subject without the pull
            // request that carried it, so the body reference in check 1 does not
            // reach the reader who needs it most. The shape is this board's own,
            // taken from the subjects already on the default branch: the issue in
            // parentheses at the end.
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const unlinked = commits.filter((c) => {
              const subject = c.commit.message.split("\n")[0];
              const merge = c.parents.length > 1 || subject.startsWith("Merge ");
              const byBot =
                (c.author && c.author.type === "Bot") ||
                /\[bot\]/.test((c.commit.author && c.commit.author.name) || "");
              return !merge && !byBot && !/\(#\d+\)\s*$/.test(subject);
            });
            if (refusingTierApplies && unlinked.length > 0) {
              refusals.push(
                "Commit subjects with no issue reference: " +
                  unlinked
                    .map((c) => `${c.sha.slice(0, 7)} ("${c.commit.message.split("\n")[0]}")`)
                    .join(", ") +
                  ". Every subject ends with the issue it is from, as `(#123)`.",
              );
            }

            // Check 3. Refuses an entry that reaches the release note in no
            // class, which drops it out of every heading a reader looks under,
            // and one that claims two, which is two changes in one pull request.
            const carried = labels.filter((l) => CLASS_LABELS.includes(l));
            if (refusingTierApplies && carried.length !== 1) {
              refusals.push(
                carried.length === 0
                  ? "No changelog class label. Apply exactly one of: " + CLASS_LABELS.join(", ") + "."
                  : "Two changelog class labels: " +
                      carried.join(", ") +
                      ". An entry belongs to one class, and a change that would carry two is two changes.",
              );
            }

            // Check 4. Refuses a change to what moves between two servers, or to
            // how a disagreement is decided, arriving in the release note as an
            // ordinary fix. The class is a property of the subject rather than of
            // the size, so the file that was touched is what decides it.
            for (const rule of CLASS_BY_SUBJECT) {
              const touched = rule.paths.filter((p) => changed.includes(p));
              if (refusingTierApplies && touched.length > 0 && !labels.includes(rule.label)) {
                refusals.push(
                  `This change touches ${touched.join(", ")}, which is ${rule.subject}, ` +
                    `and carries no \`${rule.label}\` label.`,
                );
              }
            }

            // Check 7. Refuses a body that instructs the tracker to close an
            // issue. The number is the next unused one rather than its position
            // in the file: it sits beside the other refusals, and a number
            // quoted in a red run keeps meaning one check for the life of the
            // file.
            //
            // What it is for is in the header above under "How a change says
            // what it finishes", where somebody meeting a red run is sent. The
            // short of it: the pattern is an instruction and the sentence around
            // it is not read, so a body saying a change leaves an issue open
            // closes it on merge anyway, and every author of the three that did
            // so here intended the opposite of what the merge did.
            //
            // The keywords and the spellings around them are GitHub's rather
            // than this board's, read at
            // https://docs.github.com/en/issues/tracking-your-work-with-issues/using-issues/linking-a-pull-request-to-an-issue
            // on 2026-09-04: nine keywords, matched without regard to case, an
            // optional colon after the keyword, and three shapes of reference -
            // `#N`, `OWNER/REPO#N`, and a full issue URL. A keyword the tracker
            // adds later is a keyword this list does not hold, and nothing here
            // would notice; that is the bound, and re-reading the page is what
            // moves it.
            //
            // WHAT IT DOES NOT REACH, stated rather than left to be assumed. A
            // bot is outside the refusing tier, here as at every other check, so
            // a bot body carrying the pattern still closes the issue and this
            // run says nothing about it. And what is judged is the body as the
            // run read it, so a body edited after the last run is judged by the
            // next one, which is what the `edited` trigger above buys.
            const CLOSING_KEYWORDS = [
              "close", "closes", "closed",
              "fix", "fixes", "fixed",
              "resolve", "resolves", "resolved",
            ];
            const CLOSING_REFERENCE =
              /(?:https?:\/\/github\.com\/[\w.-]+\/[\w.-]+\/issues\/\d+|[\w.-]+\/[\w.-]+#\d+|#\d+)/;
            const CLOSING_PHRASE = new RegExp(
              "\\b(?:" + CLOSING_KEYWORDS.join("|") + ")\\b[ \\t]*:?[ \\t]*" + CLOSING_REFERENCE.source,
              "gi",
            );
            // Line by line, so the refusal can say where the phrase is and the
            // author repairs it without reading the whole body again.
            const closingPhrases = (text) =>
              (text || "").split(/\r?\n/).flatMap((line, index) =>
                [...line.matchAll(CLOSING_PHRASE)].map((m) => ({ line: index + 1, phrase: m[0] })),
              );
            const phraseLabels = (found) => found.map((f) => `${f.line}: ${f.phrase}`);

            // The declaration, and the whole of it. It is a line and not a
            // phrase in a sentence, because a relation read out of prose is the
            // failure this check is against, and reading the replacement out of
            // prose would rebuild it one word over.
            //
            // At column zero, which is not decoration. The first body written
            // against this check showed the form inside an indented block, and
            // an earlier reading that allowed leading whitespace took the
            // example for a declaration. A body may therefore quote the shape
            // while declaring nothing, and a declaration is never something a
            // list or a block quote carried in by accident.
            const FINISHES_LINE = /^Finishes:[ \t]*#(\d+)[ \t]*$/;
            const declaredFinishes = (text) => {
              const found = (text || "")
                .split(/\r?\n/)
                .map((line) => FINISHES_LINE.exec(line))
                .filter((m) => m !== null)
                .map((m) => Number(m[1]));
              return [...new Set(found)].sort((a, b) => a - b);
            };

            // The near-misses this check owes, executed on every pull request
            // rather than pasted once into a body nobody re-reads. A workflow is
            // the class of change the suite cannot exercise at all - it runs
            // with nothing checked out and there is no C# to reach this from -
            // and the whole table costs milliseconds and no new apparatus.
            //
            // The first row is the one the issue asks for by name: a body naming
            // an issue with no keyword beside it passes, and it would fail under
            // a rule that matched the number alone. The rows after it are the
            // spellings, one per keyword, plus case, the colon, the two
            // non-local reference shapes, the line number, and the words that
            // merely contain a keyword or a number.
            //
            // A disagreement here fails the job OUTSIDE the audience narrowing
            // above. That narrowing is about whose obligation a convention is; a
            // self-test that disagrees means this check no longer decides what
            // it says it decides, and nothing should merge past that whoever
            // opened the pull request.
            const SELF_TEST = [
              ["a plain reference and prose naming the same issue",
                "Refs #347\n\nThis is the change #347 asked for.", [], []],
              ["the sentence that shut an issue on this board",
                "## What this is\n\nThis does not close #122; that issue stays open.",
                ["3: close #122"], []],
              ["an uppercase spelling", "CLOSES #12", ["1: CLOSES #12"], []],
              ["a colon spelling", "Fixes: #12", ["1: Fixes: #12"], []],
              ["a colon and no space", "Resolved:#12", ["1: Resolved:#12"], []],
              ["a cross-repository reference",
                "Resolves Flowfin/jellyfin-plugin-metadata-sync#12",
                ["1: Resolves Flowfin/jellyfin-plugin-metadata-sync#12"], []],
              ["a full issue URL",
                "Closed https://github.com/Flowfin/jellyfin-plugin-metadata-sync/issues/12",
                ["1: Closed https://github.com/Flowfin/jellyfin-plugin-metadata-sync/issues/12"], []],
              ["the declared relation", "Refs #347\n\nFinishes: #347\n", [], [347]],
              ["a word that ends in a keyword", "Prefixes #12 with a heading.", [], []],
              // The two word boundaries, one row each, and neither is
              // decoration. Dropping the leading one refuses the row above;
              // dropping the trailing one refuses this one, because the
              // cross-repository reference shape begins with a word character
              // and will otherwise swallow the rest of the word.
              ["a keyword that runs into a repository name", "Closest/repo#12 is the nearest.", [], []],
              ["a keyword with no reference beside it", "This closes the register.", [], []],
              ["a reference with no keyword beside it", "The register at #12 is the subject.", [], []],
              ["the line the phrase is on",
                "one\ntwo\nthree fixes #12 four\nfive", ["3: fixes #12"], []],
              ["two phrases on two lines",
                "close #1\nand resolve #2", ["1: close #1", "2: resolve #2"], []],
              ["a declaration carrying prose is not one", "Finishes: #12 and #13", [], []],
              ["an indented declaration is not one, so the shape can be quoted",
                "The form is:\n\n    Finishes: #12\n\non a line of its own.", [], []],
              ["a declaration repeated", "Finishes: #12\nFinishes: #12", [], [12]],
              ["two declarations", "Finishes: #12\nFinishes: #13", [], [12, 13]],
            ];
            for (const keyword of CLOSING_KEYWORDS) {
              SELF_TEST.push([
                `the keyword "${keyword}"`,
                `A body that says ${keyword} #12 in passing.`,
                [`1: ${keyword} #12`],
                [],
              ]);
            }
            for (const [name, text, phrases, finishes] of SELF_TEST) {
              const gotPhrases = phraseLabels(closingPhrases(text));
              const gotFinishes = declaredFinishes(text);
              if (
                gotPhrases.join(" | ") !== phrases.join(" | ") ||
                gotFinishes.join(",") !== finishes.join(",")
              ) {
                refusals.push(
                  `Check 7 self-test "${name}" disagreed: expected phrases ` +
                    `[${phrases.join(" | ")}] and declarations [${finishes.join(", ")}], got ` +
                    `[${gotPhrases.join(" | ")}] and [${gotFinishes.join(", ")}]. The closing-keyword ` +
                    "check at check 7 in .github/workflows/pr-hygiene.yml no longer decides what it " +
                    "says it decides; repair it before merging anything.",
                );
              }
            }

            const closing = closingPhrases(body);
            if (refusingTierApplies && closing.length > 0) {
              refusals.push(
                "The body carries " +
                  closing.map((c) => `\`${c.phrase}\` on line ${c.line}`).join(", ") +
                  ". The tracker reads that as an instruction to close the issue on merge, whatever " +
                  "the sentence around it says, and it has closed three issues on this board that " +
                  "way. Write the bare `#123`, which links without closing, and where this change " +
                  "does finish an issue declare it as `Finishes: #123` on a line of its own.",
              );
            }

            const finished = declaredFinishes(body);
            const finishedUnknown = finished.filter((n) => !named.includes(n));
            if (refusingTierApplies && finishedUnknown.length > 0) {
              refusals.push(
                "The body declares that it finishes " +
                  finishedUnknown.map((n) => "#" + n).join(", ") +
                  ", and no number among them is an issue on this board.",
              );
            }

            // Check 5, advisory. The number is 400 changed lines, and it is the
            // one the parity target states, which is where this repository's gate
            // is measured from:
            //
            //   gh api repos/iderex/jellyfin-plugin-sso/contents/.github/workflows/pr-hygiene.yml \
            //     --jq '.content' | base64 -d | grep -n 'WARN_AT = '
            //
            // It never refuses. A change over the number is an issue whose scope
            // was planned wrong, and the repair is to divide that issue rather
            // than to carve the finished diff in two. No reading of a diff tells
            // those two apart, so this annotates and a person decides.
            const generated = (name) =>
              name.endsWith("packages.lock.json") || name.endsWith(".min.js") || name.endsWith(".min.css");
            const churn = files
              .filter((f) => !generated(f.filename))
              .reduce((sum, f) => sum + f.additions + f.deletions, 0);
            const SIZE = 400;
            if (churn >= SIZE) {
              advisories.push(
                `This change is ${churn} lines, excluding generated and lock files, against ${SIZE}. ` +
                  "Divide the issue into sub-issues, each with its own reason to exist, rather than " +
                  "carving this diff into two halves that only make sense together.",
              );
            }

            // Check 6, advisory. Every guard on this board ships with a proof
            // that it bites, so a change to the plugin that moves no test is
            // worth a second look. It never refuses, because a comment, a project
            // file and a pure rename legitimately move none.
            const pluginChanged = changed.some(
              (n) => n.startsWith("Jellyfin.Plugin.MetadataSync/") && n.endsWith(".cs"),
            );
            const suiteChanged = changed.some((n) => n.startsWith("Jellyfin.Plugin.MetadataSync.Tests/"));
            if (pluginChanged && !suiteChanged) {
              advisories.push(
                "The plugin changed and nothing under Jellyfin.Plugin.MetadataSync.Tests did. " +
                  "Either the change is genuinely untestable, or the guard it adds has no proof that it bites.",
              );
            }

            for (const a of advisories) {
              core.warning(a);
            }

            // What the run read, before what it concluded. A run that judged
            // less than the whole set has to be distinguishable from one that
            // judged all of it and found nothing, and the only way to read that
            // off a green check is for the inputs to be printed beside the
            // verdict. This is the disclosure the audience narrowing above did
            // not have when it turned the refusing tier off in silence.
            const summary = core.summary.addHeading("Pull request hygiene", 2);
            summary.addHeading("What this run read", 3).addList([
              `author_association: ${pr.author_association || "NONE"}, user type: ${(pr.user && pr.user.type) || "unknown"}`,
              refusingTierApplies
                ? "The refusing tier applies to this change."
                : "The refusing tier is skipped: the author is a bot.",
              `issue numbers in the body: ${referenced.length === 0 ? "none" : referenced.map((n) => "#" + n).join(", ")}` +
                `; of those, an issue on this board: ${named.length === 0 ? "none" : named.map((n) => "#" + n).join(", ")}`,
              `commits read: ${commits.length}`,
              `changelog class labels carried: ${carried.length === 0 ? "none" : carried.join(", ")}`,
              `closing phrases in the body: ${closing.length === 0 ? "none" : phraseLabels(closing).join("; ")}`,
              `issues this body declares it finishes: ${finished.length === 0 ? "none declared" : finished.map((n) => "#" + n).join(", ")}`,
              `check 7 self-test rows run: ${SELF_TEST.length}`,
              `changed files: ${changed.length}, counted lines: ${churn}`,
            ]);

            if (refusals.length === 0 && advisories.length === 0) {
              summary.addRaw("Every check passed.");
            }
            if (refusals.length > 0) {
              summary.addHeading("Refused", 3).addList(refusals);
            }
            if (advisories.length > 0) {
              summary.addHeading("Advisory, and never a refusal", 3).addList(advisories);
            }
            await summary.write();

            if (refusals.length > 0) {
              core.setFailed(refusals.join(" | "));
            }
