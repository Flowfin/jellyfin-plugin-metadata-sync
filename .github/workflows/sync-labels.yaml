name: '🏷️ Sync labels'

# Synced from this repository's own `.github/labels.yaml` rather than through the
# shared workflow, because that one hardcodes the upstream label file and runs it
# with `delete-other-labels: true`, which deleted every label this plan carries.

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what the sync would change without changing anything'
        type: boolean
        default: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check out the label file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Apply the label file to this repository
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2.3.3
        with:
          config-file: .github/labels.yaml
          delete-other-labels: true
          dry-run: ${{ inputs.dry_run || false }}
          token: ${{ secrets.GITHUB_TOKEN }}
