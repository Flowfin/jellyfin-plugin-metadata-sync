name: Dependency review

on:
  pull_request:

# Read-only: the dependency-review action only inspects the PR diff against the
# advisory database, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `name:` on this job. A required status check is matched by the literal
  # check-run name, which defaults to the job id ("dependency-review") when no
  # `name:` is set, so setting one would rename the check run. This job is not
  # in this repository's required set today, so the rename would break nothing
  # yet; keeping the name stable is what lets it be added without a second edit.
  # The required set is printed rather than restated here:
  #   gh api repos/iderex/jellyfin-plugin-metadata-sync/rulesets/20464851 --jq '[.rules[] | select(.type=="required_status_checks") | .parameters.required_status_checks[].context]'
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a newly introduced or
          # upgraded dependency blocks the PR. Relax only with a documented
          # reason.
          fail-on-severity: low
