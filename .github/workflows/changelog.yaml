name: '📝 Create/Update Release Draft & Release Bump PR'

# There is no push trigger here, and the absence is deliberate rather than an
# oversight. This repository does not draft a release on every push, because
# there is nothing to release yet and the drafting route cannot complete on
# this repository as it stands:
#
#   gh release list --limit 5          # no output, no release exists
#   git ls-remote --tags origin        # no output, no tag exists
#   gh api repos/iderex/jellyfin-plugin-metadata-sync/actions/permissions/workflow
#   {"default_workflow_permissions":"read","can_approve_pull_request_reviews":false}
#
# The shared workflow called below drafts a release, then force-pushes a
# prepare-<version> branch and opens a version-bump pull request. With the
# token defaulting to read it can do none of those, and the release-drafter
# step also wants a configuration file this repository does not carry, which is
# what made every push run fail:
#
#   gh run view 31052202217 --log-failed | grep '##\[error\]'
#   ##[error]Repo load failed. Config file not found with error 404. (target: iderex/.github:.github/release-drafter.yml)
#
# Three things have to be true before a push trigger belongs here again, and
# none of them is a change to this file: a release-drafter configuration in
# this repository whose categories mark a contract change as one, which is #84;
# a token granted the write scopes the drafting steps use, which is a
# repository setting; and a plugin that is actually installable, which is #88.
# Whoever restores the trigger says which of the three they satisfied.
#
# The manual routes below are kept because a person asks for them, so a failure
# is read by whoever asked instead of accumulating on the default branch. They
# fail today on the same missing configuration. That is disclosed here rather
# than repaired, because the configuration is #84's to write and its categories
# are #84's to choose.
on:
  workflow_dispatch:
  repository_dispatch:
    types:
      - update-prep-command

# Deny at the workflow level so the job below has to name what it takes.
permissions: {}

jobs:
  call:
    # The called workflow drafts a release, pushes a prepare-<version> branch
    # with the checkout's own token, and opens the bump pull request. Those are
    # the two scopes, and they are what the steps use rather than what the
    # route would need to succeed: the drafting still fails on the missing
    # release-drafter configuration described above, which is #84's to write.
    permissions:
      contents: write
      pull-requests: write
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/changelog.yaml@eb99033a7ff644881b014bc0b4169916c854a68b # jellyfin-meta-plugins master, 2026-07-29
    with:
      repository-name: iderex/jellyfin-plugin-metadata-sync
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
