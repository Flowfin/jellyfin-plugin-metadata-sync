framework: "net9.0"
overview: "Move chosen metadata fields between two paired Jellyfin servers."
description: >
  Metadata Sync copies chosen metadata fields between two Jellyfin servers that
  an operator has paired by hand. Nothing moves until that pairing exists, and
  only the fields the field register declares ever move.

  It never copies media files, artwork or any other library bytes. File
  replication is a permanent non-goal rather than a feature that is still
  coming: this plugin reads and writes metadata through the server's own
  library calls and carries no file transfer of any kind.
